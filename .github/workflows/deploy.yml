name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter test

      - name: Build web
        env:
          CMS: ${{ vars.CMS }}
          CMS_URL: ${{ vars.CMS_URL }}
          CMS_SPACE: ${{ vars.CMS_SPACE }}
          CMS_PROJECT: ${{ vars.CMS_PROJECT }}
          CMS_DATASET: ${{ vars.CMS_DATASET }}
          CMS_TOKEN: ${{ secrets.CMS_TOKEN }}
        run: |
          CMS=$(printf '%s' "$CMS" | tr -d '\r\n')
          CMS_URL=$(printf '%s' "$CMS_URL" | tr -d '\r\n')
          CMS_SPACE=$(printf '%s' "$CMS_SPACE" | tr -d '\r\n')
          CMS_PROJECT=$(printf '%s' "$CMS_PROJECT" | tr -d '\r\n')
          CMS_DATASET=$(printf '%s' "$CMS_DATASET" | tr -d '\r\n')
          CMS_TOKEN=$(printf '%s' "$CMS_TOKEN" | tr -d '\r\n')

          flutter build web --release \
            --base-href "/${{ github.event.repository.name }}/" \
            --dart-define="CMS=$CMS" \
            --dart-define="CMS_URL=$CMS_URL" \
            --dart-define="CMS_SPACE=$CMS_SPACE" \
            --dart-define="CMS_PROJECT=$CMS_PROJECT" \
            --dart-define="CMS_DATASET=$CMS_DATASET" \
            --dart-define="CMS_TOKEN=$CMS_TOKEN"

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
