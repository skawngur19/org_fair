      - name: Build web
        run: flutter build web --release --base-href "/${{ github.event.repository.name }}/" --dart-define=CMS=${{ vars.CMS }} --dart-define=CMS_URL=${{ vars.CMS_URL }} --dart-define=CMS_SPACE=${{ vars.CMS_SPACE }} --dart-define=CMS_PROJECT=${{ vars.CMS_PROJECT }} --dart-define=CMS_DATASET=${{ vars.CMS_DATASET }} --dart-define=CMS_TOKEN=${{ secrets.CMS_TOKEN }}
